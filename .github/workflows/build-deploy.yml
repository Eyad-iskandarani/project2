name: Build and Deploy Project 2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/eyad-iskandarani/project2-backend

jobs:

  # ==========================================
  # SECTION 1: BUILD
  # ==========================================
  build:
    name: Build and Push Docker Image
    runs-on: self-hosted

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -d backend
          test -d frontend
          test -f backend/Dockerfile
          test -f backend/requirements.txt
          test -f backend/server.py
          test -f docker-compose.yaml

          echo "All required project files exist"

      - name: Check Python syntax
        run: |
          python3 -m compileall backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build completed
        run: |
          echo "Docker image built successfully"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"


  # ==========================================
  # SECTION 2: DEPLOY
  # ==========================================
  deploy:
    name: Deploy with Docker Compose
    runs-on: self-hosted

    needs: build

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create environment file
        run: |
          cat > .env <<EOF
          DB_HOST=database
          DB_PORT=5432
          DB_NAME=projectdb
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          POSTGRES_DB=projectdb
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}

          DATABASE_URL=postgresql+psycopg2://postgres:${{ secrets.DB_PASSWORD }}@database:5432/projectdb
          EOF

      - name: Stop previous deployment
        run: |
          docker compose down --remove-orphans

      - name: Pull latest images
        run: |
          docker compose pull

      - name: Start application
        run: |
          docker compose up -d

      - name: Show running services
        run: |
          docker compose ps

      - name: Wait for backend
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3002/login > /dev/null; then
              echo "Backend is working successfully"
              exit 0
            fi

            echo "Waiting for backend: attempt $attempt"
            sleep 5
          done

          echo "Backend did not start successfully"
          docker compose logs --no-color
          exit 1

      - name: Show logs if deployment fails
        if: failure()
        run: |
          docker compose logs --no-color

      - name: Deployment completed
        run: |
          echo "Application deployed successfully"
