name: Build and Deploy Project 2

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Allow the workflow to read the repository
# and publish images to GitHub Container Registry.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/eyad-iskandarani/project2-backend

jobs:

  # ==========================================
  # SECTION 1: BUILD
  # ==========================================
  build:
    name: Build and Push Docker Image
    runs-on: self-hosted

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Display runner information
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner operating system: $RUNNER_OS"
          echo "Current directory:"
          pwd

      - name: Check project directories
        run: |
          test -d backend
          test -d frontend

          echo "Backend directory exists"
          echo "Frontend directory exists"

          echo "Backend files:"
          ls -la backend

          echo "Frontend files:"
          ls -la frontend

      - name: Check required backend files
        run: |
          test -f backend/server.py
          test -f backend/requirements.txt
          test -f backend/Dockerfile

          echo "Required backend files exist"

      - name: Check frontend files
        run: |
          test -d frontend/templates
          test -d frontend/static

          echo "Frontend templates directory exists"
          echo "Frontend static directory exists"

      - name: Check Python version
        run: |
          python3 --version

      - name: Check Python syntax
        run: |
          python3 -m compileall backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build completed
        run: |
          echo "Docker image built successfully"
          echo "Image pushed to:"
          echo "${{ env.IMAGE_NAME }}:latest"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"


  # ==========================================
  # SECTION 2: DEPLOY
  # ==========================================
  deploy:
    name: Deploy Docker Image
    runs-on: self-hosted

    needs: build

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image from GHCR
        run: |
          docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Stop previous backend container
        run: |
          docker stop project2-backend || true
          docker rm project2-backend || true

      - name: Deploy backend container
        run: |
          docker run -d \
            --name project2-backend \
            --restart unless-stopped \
            -p 3002:3002 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Show running containers
        run: |
          docker ps

      - name: Verify deployed container
        run: |
          sleep 5
          docker ps --filter "name=project2-backend"

      - name: Show backend logs
        run: |
          docker logs project2-backend

      - name: Deployment completed
        run: |
          echo "Docker image deployed successfully"
