name: Build and Deploy Project 2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/eyad-iskandarani/project2-backend
  DEPLOY_DIR: /home/aau/Desktop/project2/Expense_Tracker

jobs:

  # ==========================================
  # SECTION 1: BUILD
  # ==========================================
  build:
    name: Build and Push Docker Image
    runs-on: self-hosted

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -d backend
          test -d frontend
          test -f backend/Dockerfile
          test -f backend/requirements.txt
          test -f backend/server.py

          echo "Required backend and frontend files exist"

      - name: Check Python syntax
        run: |
          python3 -m compileall backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build completed
        run: |
          echo "Image pushed successfully"
          echo "${{ env.IMAGE_NAME }}:latest"


  # ==========================================
  # SECTION 2: DEPLOY
  # ==========================================
  deploy:
    name: Deploy with Local Docker Compose
    runs-on: self-hosted

    needs: build

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check local Docker Compose file
        run: |
          test -f "${{ env.DEPLOY_DIR }}/docker-compose.yaml"
          echo "Local Docker Compose file exists"

      - name: Create local environment file
        run: |
          cat > "${{ env.DEPLOY_DIR }}/.env" <<EOF
          DB_HOST=database
          DB_PORT=5432
          DB_NAME=projectdb
          DB_USER=postgres
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          POSTGRES_DB=projectdb
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_URL=postgresql+psycopg2://postgres:${{ secrets.DB_PASSWORD }}@database:5432/projectdb
          EOF

      - name: Stop previous deployment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose down --remove-orphans

      - name: Pull latest images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull

      - name: Start application
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose up -d

      - name: Show running services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose ps

      - name: Show deployment logs
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose logs --no-color --tail=100
