name: Build and Deploy Project 2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/eyad-iskandarani/project2-backend
  DEPLOY_DIR: /home/aau/Desktop/project2/Expense_Tracker

jobs:

  # ==========================================
  # SECTION 1: BUILD
  # ==========================================
  build:
    name: Build and Push Docker Image
    runs-on: self-hosted

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -d backend
          test -d frontend
          test -f backend/Dockerfile
          test -f backend/requirements.txt
          test -f backend/server.py

          echo "Required backend and frontend files exist"

      - name: Check Python syntax
        run: |
          python3 -m compileall backend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build completed
        run: |
          echo "Docker image built and pushed successfully"
          echo "${{ env.IMAGE_NAME }}:latest"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"


  # ==========================================
  # SECTION 2: DEPLOY
  # ==========================================
  deploy:
    name: Deploy with Local Docker Compose
    runs-on: self-hosted

    needs: build

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check local deployment files
        run: |
          test -f "${{ env.DEPLOY_DIR }}/docker-compose.yaml"
          test -f "${{ env.DEPLOY_DIR }}/.env"

          echo "Local docker-compose.yaml exists"
          echo "Local .env exists"

      - name: Stop previous deployment
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose down --remove-orphans

      - name: Pull latest images
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull

      - name: Start application
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose up -d

      - name: Show running services
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose ps

      - name: Wait for backend
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3002/login > /dev/null; then
              echo "Backend is working successfully"
              exit 0
            fi

            echo "Waiting for backend: attempt ${attempt}/20"
            sleep 5
          done

          echo "Backend did not start successfully"
          exit 1

      - name: Show logs if deployment fails
        if: failure()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose ps
          docker compose logs --no-color --tail=100

      - name: Deployment completed
        run: |
          echo "Application deployed successfully"
